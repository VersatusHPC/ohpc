name: Package Count Analysis

on:
  pull_request:
    branches:
      - 4.x
      - versatushpc/4.x
      - 3.x
    paths:
      - 'components/**/*.spec'
      - 'misc/dist/count_avail_packages.sh'

permissions:
  contents: read

jobs:
  package_count_analysis:
    name: Analyze Available Package Counts
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/versatushpc/ohpc-analysis:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Fetch full history for proper branch detection

    - name: Save PR context
      env:
        EVENT_JSON: ${{ toJSON(github.event) }}
      run: |
        mkdir -p artifacts
        printenv EVENT_JSON > artifacts/event.json


    - name: Run package count analysis
      id: analysis
      run: |
        echo "Starting package count analysis..."

        set +e  # Don't exit on errors to capture both success and failure

        # Capture both stdout and stderr, and the exit code
        OUTPUT_FILE="artifacts/output.md"
        ERROR_FILE="artifacts/error.txt"

        # Extract version from base ref (e.g., "4.x" -> "4" or "versatushpc/4.x" -> "4")
        BASE_REF_NAME="${GITHUB_BASE_REF##*/}"
        VERSION="${BASE_REF_NAME%.x}"

        ./misc/dist/count_avail_packages.sh --no-glow -f "${VERSION}" > "${OUTPUT_FILE}" 2> "${ERROR_FILE}"
        EXIT_CODE=$?

        echo "exit_code=${EXIT_CODE}" >> "${GITHUB_OUTPUT}"

        if [ "${EXIT_CODE}" -eq 0 ]; then
          echo "status=success" >> "${GITHUB_OUTPUT}"
        else
          echo "status=failure" >> "${GITHUB_OUTPUT}"
        fi

    - name: Generate analysis comment
      run: |
        echo "Generating package count analysis comment..."

        # Prepare status indicators
        if [ "${{ steps.analysis.outputs.status }}" = "success" ]; then
          ANALYSIS_RESULT="✅ **Factory repositories analysis completed successfully**"
          OVERALL_STATUS="✅ **Analysis completed successfully**"
        else
          ANALYSIS_RESULT="❌ **Factory repositories analysis failed**"
          OVERALL_STATUS="❌ **Analysis failed**"
        fi

        BASE_REF_NAME="${GITHUB_BASE_REF##*/}"
        VERSION_INFO="OpenHPC ${BASE_REF_NAME%.x}.x"

        # Prepare the comment content
        {
          echo "## 📦 Package Count Analysis Results"
          echo ""
          echo "**Environment:** UBI 10 Container"
          printf "**Target Branch:** \`%s\`\n" "${GITHUB_BASE_REF}"
          echo "**Version:** ${VERSION_INFO}"
          echo "**Overall Status:** ${OVERALL_STATUS}"
          echo ""
          echo "### 🏭 Factory Repositories"
          echo "**Status:** ${ANALYSIS_RESULT}"
        } > artifacts/comment.md

        if [ -s "artifacts/output.md" ]; then
          echo "" >> artifacts/comment.md
          cat artifacts/output.md >> artifacts/comment.md
        fi

        if [ "${{ steps.analysis.outputs.status }}" != "success" ] && [ -s "artifacts/error.txt" ]; then
          {
            echo ""
            echo "#### ❌ Analysis Error Details"
            echo ""
            echo "\`\`\`"
            cat artifacts/error.txt
            echo "\`\`\`"
          } >> artifacts/comment.md
        fi

        # Add metadata footer
        {
          echo ""
          echo "---"
          echo "*Analysis performed by OpenHPC Package Count CI*  "
          echo "*Commit: \`${GITHUB_SHA:0:8}\`*  "
          echo "*Workflow: [\`${GITHUB_RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})*"
        } >> artifacts/comment.md

    - name: Upload package count results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: package-count-analysis
        retention-days: 5
        path: artifacts/

    - name: Set workflow status
      if: steps.analysis.outputs.status == 'failure'
      run: |
        echo "Package count analysis failed"
        exit 1
