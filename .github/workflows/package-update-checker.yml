name: Package Freshness Advisory

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/openhpc/ohpc-analysis:latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run package update checker
      id: check_updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Ensure we're in the repository root
        cd $GITHUB_WORKSPACE

        # Set up RPM build environment for container
        echo "Setting up RPM environment in container"
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

        # Run the script and capture output and exit code
        # Redirect stderr to avoid terminal control characters in GitHub issues
        set +e
        OUTPUT=$(python3 misc/check_for_package_updates.py -o markdown --no-glow 2>/dev/null)
        EXIT_CODE=$?
        set -e

        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

        # Save output to file for later use
        echo "$OUTPUT" > package_updates.md

        echo "Script completed with exit code: $EXIT_CODE"
        echo "Output length: $(echo "$OUTPUT" | wc -l) lines"

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Manage GitHub issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const exitCode = ${{ steps.check_updates.outputs.exit_code }};
          const currentDate = '${{ steps.date.outputs.date }}';
          const issueTitle = `📦 Package Freshness Advisory - ${currentDate}`;

          console.log(`Processing package updates with exit code: ${exitCode}`);

          // Read the markdown output
          let markdownOutput;
          try {
            markdownOutput = fs.readFileSync('package_updates.md', 'utf8');
            console.log(`Read markdown output: ${markdownOutput.length} characters`);
          } catch (error) {
            console.error('Error reading package update results:', error);
            markdownOutput = `Error reading package update results: ${error.message}`;
          }

          // Handle unexpected exit codes
          if (exitCode !== 0 && exitCode !== 1) {
            console.log(`Unexpected exit code ${exitCode}, treating as error condition`);
            markdownOutput = `⚠️ Package update checker encountered an error (exit code: ${exitCode})\n\n${markdownOutput}`;
          }

          // Search for existing open package freshness issues.
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['package-updates']
          });

          // Find the most recent package freshness issue (if any). Keep the
          // legacy title match so one manual run can update older issue names.
          const existingIssue = issues
            .filter(issue =>
              issue.title.includes('📦 Package Freshness Advisory') ||
              issue.title.includes('📦 Package Upgrades Necessary')
            )
            .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

          // Prepare issue body
          const issueBody = [
            `# Package Freshness Advisory - ${currentDate}`,
            '',
            'This manually triggered report tracks newer upstream package releases.',
            '',
            'It is advisory only. `versatushpc/4.x` follows OpenHPC GA releases for 1:1 parity, so do not update specs from this report unless upstream OpenHPC has accepted the same change.',
            '',
            `**Last checked:** ${new Date().toISOString()}`,
            `**Status:** ${exitCode === 0 ? '✅ No upstream package drift detected' : '🔄 Upstream package drift detected'}`,
            '',
            '---',
            '',
            markdownOutput,
            '',
            '---',
            '',
            '*This advisory issue is manually generated by the Package Freshness Advisory workflow.*'
          ].join('\n');

          if (exitCode === 0) {
            // No updates available
            if (existingIssue) {
              console.log(`Closing issue #${existingIssue.number} - no upstream package drift detected`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed',
                body: issueBody
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: '✅ No upstream package drift was detected by the manual advisory run. Closing this issue.'
              });
            } else {
              console.log('No upstream package drift detected and no open advisory issue exists - nothing to do');
            }
          } else {
            // Upstream package drift is available (exit code 1).
            if (existingIssue) {
              console.log(`Updating existing issue #${existingIssue.number} with latest package freshness report`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                title: issueTitle,
                body: issueBody
              });
            } else {
              console.log('Creating new advisory issue for package freshness report');
              const { data: newIssue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['package-updates', 'automation']
              });

              console.log(`Created new issue #${newIssue.number}`);
            }
          }
