name: Changed files
description: List added and modified files for push and pull request validation

outputs:
  added_modified:
    description: Space-separated list of added or modified files
    value: ${{ steps.changed.outputs.added_modified }}

runs:
  using: composite
  steps:
    - id: changed
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        HEAD_SHA="${HEAD_SHA:-HEAD}"

        if [ -n "${GITHUB_BASE_REF:-}" ]; then
          base_ref="refs/remotes/origin/${GITHUB_BASE_REF}"
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:${base_ref}"
          BASE_SHA="$(git merge-base "$HEAD_SHA" "$base_ref" 2>/dev/null || git rev-parse "$base_ref")"
        elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
          BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
        elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            git fetch --no-tags --deepen=100 origin "$GITHUB_REF_NAME" || true
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
        fi

        if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
          echo "Unable to find base commit $BASE_SHA" >&2
          git log --oneline -5 >&2
          exit 1
        fi

        files="$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" | tr '\n' ' ')"
        echo "added_modified=${files% }" >> "$GITHUB_OUTPUT"
