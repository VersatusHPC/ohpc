# OpenHPC RPM to Debian dependency name mapping
#
# Format: rpm_name: debian_name
# Used by build_deb.sh and for reference when writing debian/control files.
#
# When a package has no direct equivalent, it is marked with a comment.

# Build Tools
gcc: gcc
gcc-c++: g++
gcc-gfortran: gfortran
make: make
cmake: cmake
autoconf: autoconf
automake: automake
libtool: libtool
libtool-ltdl: libltdl-dev
pkgconfig: pkg-config
pkg-config: pkg-config
bison: bison
flex: flex
m4: m4
patch: patch
texinfo: texinfo
gettext: gettext
gettext-devel: gettext
fakeroot: fakeroot
rpm-build: ~  # not needed for Debian

# Core Development Libraries
glibc-devel: libc6-dev
binutils-devel: binutils-dev
zlib-devel: zlib1g-dev
bzip2-devel: libbz2-dev
xz-devel: liblzma-dev
libxml2-devel: libxml2-dev
libffi-devel: libffi-dev
expat-devel: libexpat1-dev
sqlite-devel: libsqlite3-dev

# Networking and Security
openssl-devel: libssl-dev
libcurl-devel: libcurl4-openssl-dev
pam-devel: libpam0g-dev
libssh2-devel: libssh2-1-dev

# RDMA / InfiniBand / Fabric
libibverbs-devel: libibverbs-dev
librdmacm-devel: librdmacm-dev
libibumad-devel: libibumad-dev
libfabric-devel: libfabric-dev
rdma-core-devel: rdma-core

# Hardware / System
numactl-devel: libnuma-dev
numactl: numactl
hwloc-devel: libhwloc-dev
pciutils-devel: libpci-dev
libsysfs-devel: libsysfs-dev
systemd-devel: libsystemd-dev
udev: udev

# Scripting / Languages
lua-devel: liblua5.4-dev
lua-filesystem: lua-filesystem
lua-posix: lua-posix
lua-libs: liblua5.4-0
tcl-devel: tcl-dev
python3-devel: python3-dev
python3-setuptools: python3-setuptools
python3-Cython: cython3
python3-numpy: python3-numpy
perl: perl
perl-devel: libperl-dev
perl-ExtUtils-MakeMaker: perl
swig: swig

# Terminal / UI
ncurses-devel: libncurses-dev
readline-devel: libreadline-dev
cairo-devel: libcairo2-dev
libX11-devel: libx11-dev
gtk2-devel: libgtk2.0-dev

# Database
mariadb-devel: libmariadb-dev
mysql-devel: libmysqlclient-dev

# Math / Science (system)
lapack-devel: liblapack-dev
blas-devel: libblas-dev

# Event / Threading
libevent-devel: libevent-dev
libatomic: libatomic1

# System Tools
procps-ng: procps
ipmitool: ipmitool
emacs-nox: emacs-nox
NetworkManager: network-manager
man-db: man-db
which: debianutils
hostname: hostname

# Distro-specific (not applicable on Ubuntu)
epel-release: ~
redhat-release: ~
dnf-utils: ~

# SUSE-specific (not applicable)
lua53-devel: ~
lua53-luafilesystem: ~
lua53-luaposix: ~
apparmor-abstractions: ~
